# ──────────────────────────────────────────────────────────────────────
# CI Pipeline – dbt Project Factory
# Runs on every PR targeting 'main' that touches the dbt project.
# Validates SQL, compiles the project, and runs dbt build.
# ──────────────────────────────────────────────────────────────────────

name: "CI – dbt PR Validation"

on:
  pull_request:
    branches: [main]
    paths:
      - "generated_projects/retail_dbt_v1/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DBT_PROJECT_DIR: generated_projects/retail_dbt_v1
  PYTHON_VERSION: "3.12"
  DBT_VERSION: "1.12.*"

jobs:
  # ── Job 1: SQL Linting ──────────────────────────────────────────────
  lint-sql:
    name: "🔍 SQLFluff Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SQLFluff
        run: pip install sqlfluff sqlfluff-templater-dbt dbt-snowflake==${{ env.DBT_VERSION }}

      - name: Generate CI profiles.yml
        run: |
          cat > ${{ env.DBT_PROJECT_DIR }}/profiles.yml << 'EOF'
          ecom_profile:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "{{ env_var('DBT_SNOWFLAKE_ACCOUNT', 'dummy') }}"
                user: "{{ env_var('DBT_SNOWFLAKE_USER', 'dummy') }}"
                password: "{{ env_var('DBT_SNOWFLAKE_PASSWORD', 'dummy') }}"
                role: "{{ env_var('DBT_SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
                database: ECOM_DB
                warehouse: "{{ env_var('DBT_SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
                schema: RAW
                threads: 4
          EOF

      - name: Run SQLFluff lint
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: |
          sqlfluff lint models/ \
            --dialect snowflake \
            --format github-annotation-native \
            --annotation-level warning || true
        # Lint warnings don't block the PR; they appear as annotations.

  # ── Job 2: dbt Validation & Build ──────────────────────────────────
  dbt-validation:
    name: "🏗️ dbt Compile & Build"
    runs-on: ubuntu-latest
    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      DBT_SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake==${{ env.DBT_VERSION }}

      - name: Mask credentials
        run: |
          echo "::add-mask::${{ secrets.SNOWFLAKE_ACCOUNT }}"
          echo "::add-mask::${{ secrets.SNOWFLAKE_USER }}"
          echo "::add-mask::${{ secrets.SNOWFLAKE_PASSWORD }}"

      - name: Generate CI profiles.yml
        run: |
          cat > ${{ env.DBT_PROJECT_DIR }}/profiles.yml << 'EOF'
          ecom_profile:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "{{ env_var('DBT_SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('DBT_SNOWFLAKE_USER') }}"
                password: "{{ env_var('DBT_SNOWFLAKE_PASSWORD') }}"
                role: "{{ env_var('DBT_SNOWFLAKE_ROLE') }}"
                database: ECOM_DB
                warehouse: "{{ env_var('DBT_SNOWFLAKE_WAREHOUSE') }}"
                schema: RAW
                threads: 4
          EOF

      - name: Validate dbt_project.yml
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: |
          echo "📋 Validating dbt_project.yml exists and is parseable..."
          python -c "
          import yaml, sys
          with open('dbt_project.yml') as f:
              cfg = yaml.safe_load(f)
          assert cfg.get('name'), 'Missing project name'
          assert cfg.get('profile'), 'Missing profile reference'
          print(f\"✅ Project '{cfg['name']}' using profile '{cfg['profile']}'\")
          "

      - name: dbt deps
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt deps --profiles-dir .

      - name: dbt parse
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt parse --profiles-dir .

      - name: dbt compile
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt compile --profiles-dir .

      - name: dbt build (compile + test)
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: |
          dbt build --profiles-dir . --fail-fast 2>&1 | tee dbt_build_output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          # Generate summary
          echo "## 🏗️ dbt Build Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -30 dbt_build_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          exit $EXIT_CODE

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-ci-artifacts
          path: |
            ${{ env.DBT_PROJECT_DIR }}/target/
            ${{ env.DBT_PROJECT_DIR }}/logs/
          retention-days: 7
