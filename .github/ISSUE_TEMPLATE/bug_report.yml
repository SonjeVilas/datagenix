name: Bug Report
description: Report a bug or unexpected behavior in Datagenix
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **Datagenix**! Never paste real API keys, passwords, or private Snowflake account identifiers in your report.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can maintainers reproduce this behavior?
      placeholder: |
        1. Run `streamlit run app.py` or `python main.py ...`
        2. Enter ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error logs / output (redacted)
      description: Paste any relevant terminal stack traces (make sure secrets are masked).
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, dbt-snowflake version
      placeholder: "e.g., Windows 11 / Ubuntu 24.04, Python 3.12, dbt-core 1.12"
