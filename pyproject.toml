[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datagenix"
version = "1.0.0"
description = "Datagenix — Autonomous Multi-Agent AI dbt Engineering Platform powered by Google Gemini and LangGraph for Snowflake."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Vilas Sonje" },
]
keywords = ["dbt", "snowflake", "langgraph", "gemini", "multi-agent", "data-engineering", "sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/SonjeVilas/datagenix"
Repository = "https://github.com/SonjeVilas/datagenix"
Issues = "https://github.com/SonjeVilas/datagenix/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["generated_projects", ".venv"]
