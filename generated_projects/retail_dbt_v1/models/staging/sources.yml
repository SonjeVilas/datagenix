version: 2

sources:
  - name: RAW
    database: ECOM_DB
    schema: RAW
    description: Raw e-commerce data ingested from operational systems.
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}
    loaded_at_field: CREATED_AT
    tables:
      - name: CUSTOMERS
        description: Retail store customers containing profile and registration details.
        loaded_at_field: CREATED_AT
        columns:
          - name: CUSTOMER_ID
            data_type: NUMBER
            description: Unique identifier for each customer.
            tests:
              - unique
              - not_null
          - name: FIRST_NAME
            data_type: TEXT
            description: Customer's first name.
          - name: LAST_NAME
            data_type: TEXT
            description: Customer's last name.
          - name: EMAIL
            data_type: TEXT
            description: Customer's email address.
          - name: CREATED_AT
            data_type: TIMESTAMP_NTZ
            description: Timestamp when the customer record was created.

      - name: ORDERS
        description: Retail orders placed by customers including transaction amounts and status.
        loaded_at_field: ORDER_DATE
        columns:
          - name: ORDER_ID
            data_type: NUMBER
            description: Unique identifier for each order.
            tests:
              - unique
              - not_null
          - name: CUSTOMER_ID
            data_type: NUMBER
            description: Identifier of the customer who placed the order.
            tests:
              - not_null
              - relationships:
                  to: source('RAW', 'CUSTOMERS')
                  field: CUSTOMER_ID
          - name: ORDER_DATE
            data_type: DATE
            description: Date when the order was placed.
          - name: STATUS
            data_type: TEXT
            description: Current status of the order.
          - name: TOTAL_AMOUNT
            data_type: NUMBER
            description: Total monetary amount for the order.

      - name: ORDER_ITEMS
        description: Line items associated with retail orders.
        columns:
          - name: ITEM_ID
            data_type: NUMBER
            description: Unique identifier for each order item.
            tests:
              - unique
              - not_null
          - name: ORDER_ID
            data_type: NUMBER
            description: Identifier of the parent order.
            tests:
              - not_null
              - relationships:
                  to: source('RAW', 'ORDERS')
                  field: ORDER_ID
          - name: PRODUCT_ID
            data_type: NUMBER
            description: Identifier of the product being ordered.
            tests:
              - not_null
          - name: QUANTITY
            data_type: NUMBER
            description: Quantity of the product ordered.
          - name: UNIT_PRICE
            data_type: NUMBER
            description: Unit price of the product.
